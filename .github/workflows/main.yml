name: Pokemon Restock Monitor

on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Diagnostic Fnac
        run: |
          curl -L -sS \
            -A "Mozilla/5.0" \
            "https://www.fnac.com/Cartes-a-collectionner-Pokemon-30A-Coffret-Amphinobi-ex/a23200310/w-4" \
            -o fnac.html

          echo "=== RECHERCHE DU STATUT ==="

          if grep -qi "Indisponible en ligne" fnac.html; then
            echo "TROUVE : Indisponible en ligne"
          else
            echo "PAS TROUVE : Indisponible en ligne"
          fi

          echo "=== TAILLE DE LA PAGE ==="
          wc -c fnac.html
