name: Pokemon Restock Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check Fnac stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PAGE=$(curl -L -sS \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36" \
            "https://www.fnac.com/Cartes-a-collectionner-Pokemon-30A-Coffret-Amphinobi-ex/a23200310/w-4")

          echo "$PAGE" | grep -oiE "en stock|stock en ligne|indisponible en ligne|stock en ligne épuisé" | sort -u || true

          if echo "$PAGE" | grep -qiE "indisponible en ligne|stock en ligne épuisé|stock en ligne épuisé"; then
            echo "Produit indisponible."
          elif echo "$PAGE" | grep -qiE "en stock en ligne|plus que [0-9]+ en stock|ajouter au panier"; then
            curl -sS -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=🚨 STOCK FNAC ! Coffret Pokémon 30A Amphinobi-ex : https://www.fnac.com/Cartes-a-collectionner-Pokemon-30A-Coffret-Amphinobi-ex/a23200310/w-4"
          else
            echo "Statut Fnac non déterminé : aucune alerte envoyée."
          fi
