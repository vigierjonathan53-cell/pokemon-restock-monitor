name: Pokemon Restock Monitor

on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Diagnostic Fnac
        run: |
          curl -L -sS \
            -A "Mozilla/5.0" \
            "https://www.fnac.com/Cartes-a-collectionner-Pokemon-30A-Coffret-Amphinobi-ex/a23200310/w-4" \
            -o fnac.html

          echo "=== TEXTES DISPONIBILITÉ TROUVÉS ==="

          grep -oiE \
            "Indisponible en ligne|Ajouter au panier|Ajouter au panier en 1 clic|En stock|Disponible|Rupture de stock" \
            fnac.html | sort -fu || true

          echo "=== TAILLE DE LA PAGE ==="
          wc -c fnac.html