name: Pokemon Restock Monitor

on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Diagnostic Fnac
        run: |
          curl -L -sS \
            -A "Mozilla/5.0" \
            "https://www.fnac.com/Cartes-a-collectionner-Pokemon-30A-Coffret-Amphinobi-ex/a23200310/w-4" \
            -o fnac.html

          echo "=== CONTEXTE DU MOT DISPONIBLE ==="

          grep -oiE ".{0,150}disponible.{0,250}" fnac.html | head -10 || true

          echo "=== CONTEXTE DU MOT INDISPONIBLE ==="

          grep -oiE ".{0,150}indisponible.{0,250}" fnac.html | head -10 || true

          echo "=== TAILLE DE LA PAGE ==="
          wc -c fnac.html