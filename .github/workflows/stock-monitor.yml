name: Stock Monitor

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Vérifier disponibilité Fnac
        run: |
          curl -L -sS \
            -A "Mozilla/5.0" \
            -o fnac.html \
            "https://www.fnac.com/Cartes-a-collectionner-Pokemon-30A-Coffret-Amphinobi-ex/a23200310/w-4"

          echo "=== DONNÉES DE DISPONIBILITÉ FNAC ==="

          grep -oiE '"availability[^"]*"[^,}]*' fnac.html | head -20 || true

          echo "=== ÉTATS DE STOCK ==="

          grep -oiE 'in-stock|out-of-stock|sold-out|limited-availability|online-only|pre-order|pre-sale' fnac.html | sort -fu || true

          echo "=== TAILLE ==="
          wc -c fnac.html